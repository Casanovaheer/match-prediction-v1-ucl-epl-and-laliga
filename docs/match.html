<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Predictor — type two teams</title>
<style>
  :root{
    --bg:#0f1418; --card:#171f26; --line:#26323c; --ink:#e8eef2; --dim:#8ea0ad;
    --accent:#37d67a; --warn:#f5b642; --bad:#7c8894; --chip:#1f2a33;
    --strong:#37d67a; --solid:#7fd4a0; --lean:#c9d17a; --flip:#7c8894;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f2f5f7; --card:#ffffff; --line:#dde5ea; --ink:#132029; --dim:#5c6f7c;
      --accent:#0f9d58; --warn:#b9770f; --bad:#8a97a1; --chip:#eef3f6;
      --strong:#0f9d58; --solid:#3c9e6a; --lean:#8a8f2a; --flip:#8a97a1;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px;}
  h1{font-size:20px;margin:6px 0 2px;}
  .sub{color:var(--dim);font-size:13px;margin:0 0 16px;}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;}
  input[type=text]{width:100%;padding:12px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink);font-size:16px;}
  input:focus{outline:2px solid var(--accent);outline-offset:0;}
  .go{grid-column:1/3;padding:13px;border:0;border-radius:10px;
    background:var(--accent);color:#04130a;font-weight:700;font-size:16px;cursor:pointer;}
  .swap{grid-column:1/3;text-align:center;color:var(--dim);font-size:12px;
    cursor:pointer;user-select:none;margin-top:-2px;}
  .tabs{display:flex;gap:6px;margin:18px 0 12px;}
  .tab{flex:1;text-align:center;padding:9px;border:1px solid var(--line);
    border-radius:9px;background:var(--card);color:var(--dim);cursor:pointer;font-size:14px;}
  .tab.on{color:var(--ink);border-color:var(--accent);font-weight:600;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:14px;}
  .fixture{font-size:18px;font-weight:700;}
  .meta{color:var(--dim);font-size:12px;margin-top:2px;}
  .engine{font-size:12px;margin-top:4px;padding:6px 9px;border-radius:8px;
    background:var(--chip);color:var(--dim);}
  .engine.rough{color:var(--warn);}
  .top{margin:14px 0;padding:12px;border-radius:10px;background:var(--chip);}
  .top .k{font-size:11px;letter-spacing:.08em;color:var(--dim);}
  .top .v{font-size:18px;font-weight:700;margin-top:2px;}
  .xg{color:var(--dim);font-size:13px;margin-top:8px;}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);}
  th{color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.04em;}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;}
  .pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;}
  .STRONG{background:var(--strong);color:#04130a;}
  .solid{color:var(--solid);border:1px solid var(--solid);}
  .lean{color:var(--lean);border:1px solid var(--lean);}
  .flip{color:var(--flip);border:1px solid var(--flip);}
  .avoid{margin-top:12px;padding:10px 12px;border-radius:9px;
    border:1px dashed var(--flip);color:var(--dim);font-size:13px;}
  .avoid b{color:var(--ink);}
  .sec{font-size:11px;letter-spacing:.08em;color:var(--dim);margin:16px 0 4px;}
  .scores{display:flex;flex-wrap:wrap;gap:8px;}
  .scores span{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:13px;
    font-variant-numeric:tabular-nums;}
  .suggest{margin-top:10px;color:var(--dim);font-size:14px;}
  .chip{display:inline-block;background:var(--chip);border:1px solid var(--line);
    border-radius:20px;padding:5px 11px;margin:4px 4px 0 0;cursor:pointer;font-size:13px;color:var(--ink);}
  .lp .call{font-size:16px;font-weight:600;margin-bottom:6px;}
  .lp p{margin:6px 0;}
  .lp .say{background:var(--chip);border-left:3px solid var(--accent);
    padding:10px 12px;border-radius:6px;font-style:italic;}
  .lp ul{margin:6px 0;padding-left:20px;}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:24px;line-height:1.7;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚽ Match Predictor</h1>
  <p class="sub" id="sub">Type two teams — home first. Spelling is forgiving.</p>

  <div class="form">
    <div><label for="home">Home team</label>
      <input type="text" id="home" list="teamlist" autocomplete="off" placeholder="e.g. Arsenal"></div>
    <div><label for="away">Away team</label>
      <input type="text" id="away" list="teamlist" autocomplete="off" placeholder="e.g. Chelsea"></div>
    <div class="swap" id="swap">⇅ swap home / away</div>
    <button class="go" id="go">Predict</button>
  </div>
  <datalist id="teamlist"></datalist>

  <div class="tabs hidden" id="tabs">
    <div class="tab on" data-tab="picks">Top Picks</div>
    <div class="tab" data-tab="live">Live Prep</div>
  </div>

  <div id="out"></div>

  <p class="foot" id="foot"></p>
</div>

<script>
"use strict";
const FACT=[1]; for(let i=1;i<=25;i++) FACT[i]=FACT[i-1]*i;
const pois=(k,lam)=>Math.exp(-lam)*Math.pow(lam,k)/FACT[k];
const pct=p=>(p*100).toFixed(1)+"%";
const pct0=p=>Math.round(p*100)+"%";
const odds=p=>p>0?(1/p).toFixed(2):"—";

let DATA=null, ENGINE=null, MATRIX=null, HOME="", AWAY="", TAB="picks";

fetch("predictions.json").then(r=>r.json()).then(d=>{
  DATA=d; buildIndex(); fillDatalist();
  document.getElementById("foot").innerHTML =
    "Ratings snapshot: "+(d.data_through||"?")+" · built "+(d.generated||"?")+
    "<br>Probabilities, not tips. A 70% favourite still loses 3 times in 10 — that's the model working.";
}).catch(e=>{
  document.getElementById("out").innerHTML =
    "<div class='card'>Couldn't load the data file. If you just opened this on your computer, "+
    "view it through the GitHub link instead of double-clicking the file.</div>";
});

// ---- name index -----------------------------------------------------------
let DC_TEAMS={};   // comp -> {lowername -> rating}
let DC_NAMES=[];   // display names in collected leagues
let ELO_MAP={};    // lowername -> {name, elo}
let ELO_NAMES=[];
const ALIAS={ "kups":"Kuopio", "psg":"Paris SG", "man utd":"Man United",
  "spurs":"Tottenham", "wolves":"Wolves", "inter":"Inter", "atletico":"Atletico",
  "atleti":"Atletico", "barca":"Barcelona", "bayern":"Bayern", "juve":"Juventus" };

function buildIndex(){
  for(const comp in DATA.competitions){
    const c=DATA.competitions[comp]; DC_TEAMS[comp]={};
    c.ratings.forEach(r=>{ DC_TEAMS[comp][r.team.toLowerCase()]=r; DC_NAMES.push(r.team); });
  }
  if(DATA.elo){ DATA.elo.clubs.forEach(c=>{
    ELO_MAP[c.name.toLowerCase()]=c; ELO_NAMES.push(c.name); }); }
}
function fillDatalist(){
  const all=Array.from(new Set(DC_NAMES.concat(ELO_NAMES))).sort();
  document.getElementById("teamlist").innerHTML =
    all.map(n=>"<option value=\""+n.replace(/"/g,'&quot;')+"\">").join("");
}

// bigram Dice similarity for "did you mean" suggestions
function bigrams(s){ s=s.toLowerCase().replace(/[^a-z0-9]/g,""); const g=[];
  for(let i=0;i<s.length-1;i++) g.push(s.slice(i,i+2)); return g; }
function sim(a,b){ const A=bigrams(a),B=bigrams(b); if(!A.length||!B.length)return 0;
  const m={}; A.forEach(x=>m[x]=(m[x]||0)+1); let hit=0;
  B.forEach(x=>{ if(m[x]>0){hit++;m[x]--;} }); return 2*hit/(A.length+B.length); }

// resolve a typed name within a pool of display names; returns {name} or suggestions
function resolve(raw, names){
  const q=raw.trim().toLowerCase();
  if(!q) return {suggest:[]};
  if(ALIAS[q]) raw=ALIAS[q];
  const low=raw.trim().toLowerCase();
  const lowmap={}; names.forEach(n=>lowmap[n.toLowerCase()]=n);
  if(lowmap[low]) return {name:lowmap[low]};
  const starts=names.filter(n=>n.toLowerCase().startsWith(low));
  if(starts.length===1) return {name:starts[0]};
  const subs=names.filter(n=>n.toLowerCase().includes(low));
  if(subs.length===1) return {name:subs[0]};
  const ranked=names.map(n=>[n,sim(low,n)]).sort((a,b)=>b[1]-a[1]);
  if(ranked[0] && ranked[0][1]>=0.6 && (!ranked[1]||ranked[0][1]-ranked[1][1]>0.15))
    return {name:ranked[0][0]};
  const pool=(starts.length?starts:subs.length?subs:ranked.filter(r=>r[1]>0.25).map(r=>r[0]));
  return {suggest:pool.slice(0,6)};
}

// ---- engine selection & matrices -----------------------------------------
function dcMatrix(h,a,p){
  const n=p.max_goals+1;
  const lam=Math.min(Math.exp(p.intercept+h.attack+a.defence+p.home_adv),25);
  const mu =Math.min(Math.exp(p.intercept+a.attack+h.defence),25);
  return buildMatrix(lam,mu,p.rho,n);
}
function eloMatrix(eh,ea,cal){
  const n=cal.max_goals+1, gap=(eh-ea)/100;
  const lam=Math.min(Math.exp(cal.intercept+cal.slope_per_100_elo*gap+cal.home_adv),25);
  const mu =Math.min(Math.exp(cal.intercept-cal.slope_per_100_elo*gap),25);
  return buildMatrix(lam,mu,cal.rho,n);
}
function buildMatrix(lam,mu,rho,n){
  const gh=[],ga=[]; for(let i=0;i<n;i++){gh.push(pois(i,lam));ga.push(pois(i,mu));}
  const m=[]; for(let i=0;i<n;i++){m.push([]); for(let j=0;j<n;j++) m[i][j]=gh[i]*ga[j];}
  m[0][0]*=1-lam*mu*rho; m[0][1]*=1+lam*rho; m[1][0]*=1+mu*rho; m[1][1]*=1-rho;
  let tot=0; for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(m[i][j]<0)m[i][j]=0;tot+=m[i][j];}
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)m[i][j]/=tot;
  return {m,lam,mu,n};
}

// try Dixon-Coles first (both teams in one collected league), else Elo bridge
function predict(homeRaw,awayRaw){
  for(const comp in DC_TEAMS){
    const rh=resolve(homeRaw,DC_NAMES), ra=resolve(awayRaw,DC_NAMES);
    if(rh.name&&ra.name){
      const h=DC_TEAMS[comp][rh.name.toLowerCase()], a=DC_TEAMS[comp][ra.name.toLowerCase()];
      if(h&&a){
        const c=DATA.competitions[comp];
        return {ok:true,kind:"dc",home:rh.name,away:ra.name,
          mx:dcMatrix(h,a,c.params),
          meta:c.name+" · ratings as of "+c.as_of,
          engine:"Dixon-Coles — the validated path. 52.6% measured accuracy over 8,360 out-of-sample matches. Trust this most."};
      }
    }
  }
  if(!DATA.elo) return {ok:false,error:"no-elo"};
  const rh=resolve(homeRaw,ELO_NAMES), ra=resolve(awayRaw,ELO_NAMES);
  if(!rh.name) return {ok:false,which:"home",raw:homeRaw,suggest:rh.suggest};
  if(!ra.name) return {ok:false,which:"away",raw:awayRaw,suggest:ra.suggest};
  const eh=ELO_MAP[rh.name.toLowerCase()], ea=ELO_MAP[ra.name.toLowerCase()];
  const gap=eh.elo-ea.elo;
  return {ok:true,kind:"elo",home:rh.name,away:ra.name,rough:true,
    mx:eloMatrix(eh.elo,ea.elo,DATA.elo.calibration),
    meta:"Elo "+Math.round(eh.elo)+" v "+Math.round(ea.elo)+" (gap "+(gap>=0?"+":"")+Math.round(gap)+") · snapshot "+DATA.elo.snapshot_date,
    engine:"Elo bridge — WEAKER. This league isn't in the proven model; ratings come from ClubElo and goals are calibrated on Big-5 football. NO measured accuracy, no team news. Treat as rough."};
}

// ---- markets (ported from src/toppick.py) ---------------------------------
function analyse(mx){
  const {m,n}=mx; let ph=0,pdw=0,pa=0,btts=0,lam=0,mu=0;
  const P={over15:0,over25:0,over35:0,under15:0,under25:0,under35:0,
    hScore:0,aScore:0,awayBy2:0,homeBy2:0};
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const p=m[i][j],t=i+j,d=i-j; lam+=p*i; mu+=p*j;
    if(i>j)ph+=p; else if(i===j)pdw+=p; else pa+=p;
    if(i>=1&&j>=1)btts+=p;
    if(t>=2)P.over15+=p; else P.under15+=p;
    if(t>=3)P.over25+=p; else P.under25+=p;
    if(t>=4)P.over35+=p; else P.under35+=p;
    if(d<=-2)P.awayBy2+=p; if(d>=2)P.homeBy2+=p;
  }
  for(let j=0;j<n;j++)P.hScore+=m[0][j]; P.hScore=1-P.hScore;
  for(let i=0;i<n;i++)P.aScore+=m[i][0]; P.aScore=1-P.aScore;
  return {ph,pdw,pa,btts,lam,mu,total:lam+mu,...P};
}
function tier(p){const e=p-0.5;
  if(e>0.20)return"STRONG"; if(e>0.10)return"solid"; if(e>0.03)return"lean"; return"flip";}
function tierLabel(t){return t==="flip"?"COIN FLIP":t;}

function markets(mx,home,away){
  const a=analyse(mx), {ph,pdw,pa}=a;
  const spec=[
    ["Match result",[[home+" win",ph],["Draw",pdw],[away+" win",pa]]],
    ["Double chance",[[home+" win or draw",ph+pdw],[away+" win or draw",pa+pdw],["Either team (no draw)",ph+pa]]],
    ["Draw no bet",[[home,ph/(ph+pa)],[away,pa/(ph+pa)]]],
    ["Over/Under 1.5",[["Over 1.5",a.over15],["Under 1.5",a.under15]]],
    ["Over/Under 2.5",[["Over 2.5",a.over25],["Under 2.5",a.under25]]],
    ["Over/Under 3.5",[["Over 3.5",a.over35],["Under 3.5",a.under35]]],
    ["Both teams score",[["Yes",a.btts],["No",1-a.btts]]],
    ["Winning margin 2+",[[away+" by 2+",a.awayBy2],["anything else",1-a.awayBy2]]],
    [home+" to score",[["Yes",a.hScore],["No",1-a.hScore]]],
    [away+" to score",[["Yes",a.aScore],["No",1-a.aScore]]],
  ];
  return spec.map(([mkt,outs])=>{
    let best=outs[0]; outs.forEach(o=>{if(o[1]>best[1])best=o;});
    return {market:mkt,pick:best[0],p:best[1]};
  });
}

// ---- renderers ------------------------------------------------------------
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function renderPicks(res){
  const rows=markets(res.mx,res.home,res.away).sort((x,y)=>y.p-x.p);
  const a=analyse(res.mx), best=rows[0], {m,n}=res.mx;
  const flips=rows.filter(r=>tier(r.p)==="flip");
  let h="";
  h+=head(res);
  h+="<div class='top'><div class='k'>TOP PICK</div><div class='v'>"+
     esc(best.market)+": "+esc(best.pick)+"</div>"+
     "<div class='xg'>"+pct(best.p)+" · fair odds "+odds(best.p)+"</div></div>";
  h+="<div class='xg'>Expected goals "+a.lam.toFixed(2)+" – "+a.mu.toFixed(2)+
     " (total "+a.total.toFixed(2)+")</div>";
  h+="<table><thead><tr><th>Market</th><th>Pick</th><th class='n'>Prob</th>"+
     "<th class='n'>Odds</th><th>Conf.</th></tr></thead><tbody>";
  rows.forEach(r=>{const t=tier(r.p);
    h+="<tr><td>"+esc(r.market)+"</td><td>"+esc(r.pick)+"</td><td class='n'>"+
       pct(r.p)+"</td><td class='n'>"+odds(r.p)+"</td><td><span class='pill "+t+"'>"+
       tierLabel(t)+"</span></td></tr>";});
  h+="</tbody></table>";

  // correct score
  const flat=[]; for(let i=0;i<n;i++)for(let j=0;j<n;j++)flat.push([i,j,m[i][j]]);
  flat.sort((x,y)=>y[2]-x[2]);
  h+="<div class='sec'>MOST LIKELY SCORES</div><div class='scores'>";
  flat.slice(0,6).forEach(s=>h+="<span>"+s[0]+"–"+s[1]+"  "+pct0(s[2])+"</span>");
  h+="</div>";

  // winning margin
  const marg=[[res.home+" by 2+",(i,j)=>i-j>=2],[res.home+" by 1",(i,j)=>i-j===1],
    ["Draw",(i,j)=>i===j],[res.away+" by 1",(i,j)=>i-j===-1],
    [res.away+" by 2",(i,j)=>i-j===-2],[res.away+" by 3+",(i,j)=>i-j<=-3]];
  h+="<div class='sec'>WINNING MARGIN</div><div class='scores'>";
  marg.forEach(([lab,f])=>{let s=0;for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(f(i,j))s+=m[i][j];
    h+="<span>"+esc(lab)+"  "+pct0(s)+"</span>";});
  h+="</div>";

  if(flips.length){
    h+="<div class='avoid'><b>Do not bet these</b> — the model has no real view (coin flips):<br>";
    h+=flips.map(r=>esc(r.market)+" ("+pct(r.p)+")").join(" · ")+"</div>";
  }
  return h;
}

function renderLive(res){
  const a=analyse(res.mx), {ph,pdw,pa}=a, {m,n}=res.mx;
  const dnbH=ph/(ph+pa);
  let fav,dog,favP;
  if(ph>=pa){fav=res.home;dog=res.away;favP=dnbH;} else {fav=res.away;dog=res.home;favP=1-dnbH;}
  let call;
  if(favP<0.55) call="Too close to call. Do NOT name a winner as if it's settled — if pushed, a whisker toward "+fav+".";
  else if(favP<0.62) call="Slight lean to "+fav+". Say it's tight — anyone can win this.";
  else if(favP<0.72) call=fav+" are favourites, but "+dog+" are live. Not a formality.";
  else call=fav+" are strong favourites. "+dog+" would be an upset.";
  let draw;
  if(pdw>=0.28) draw="A draw is very much on the table ("+pct0(pdw)+") — plant that early.";
  else if(pdw>=0.22) draw="A draw is a real possibility ("+pct0(pdw)+").";
  else draw="A draw is less likely ("+pct0(pdw)+").";
  let shape;
  if(a.total>=3.1) shape="Open game — lean toward goals.";
  else if(a.total<=2.3) shape="Tight, low-scoring game likely.";
  else shape="Moderate — not a shootout, not a lock-down.";
  // most likely score
  let ms=[0,0,m[0][0]]; for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(m[i][j]>ms[2])ms=[i,j,m[i][j]];
  const watch=[];
  if(favP>=0.72) watch.push("Will "+dog+" sit deep and defend? If "+fav+" don't score early, the crowd gets nervous and it opens up.");
  if(a.total<=2.3) watch.push("First goal is huge — in a tight game, whoever scores first usually holds on.");
  if(a.btts>=0.58&&a.total>=2.8) watch.push("Both likely to score — don't be shocked by a "+ms[0]+"–"+ms[1]+" type end-to-end game.");
  if(a.btts<=0.45){const weaker=a.mu<a.lam?res.away:res.home; watch.push("One side may get shut out — "+weaker+" could be kept quiet.");}
  if(pdw>=0.28) watch.push("Set the expectation that a stalemate is a genuine result.");
  if(!watch.length) watch.push("No single number dominates — call it a balanced, even contest.");
  const winP=Math.max(ph,pa);
  let say="“This is a probability, not a promise. "+fav+" come out ahead more often than not, but a "+
    pct0(winP)+" favourite still loses plenty of the time — that's the model working, not failing. "+
    "And I've got no team news here: no injuries, no line-ups, no rotation.”";
  if(res.rough) say+=" <br><br>Extra caveat: “These numbers are a rough estimate — this league isn't in my proven model, so trust them less than a Premier League or La Liga call.”";

  let h=head(res);
  h+="<div class='lp'>";
  h+="<div class='sec'>1 · THE CALL</div><div class='call'>"+esc(call)+"</div><p>"+esc(draw)+"</p>";
  h+="<p class='meta'>Win odds: "+esc(res.home)+" "+pct0(ph)+" · Draw "+pct0(pdw)+" · "+esc(res.away)+" "+pct0(pa)+"</p>";
  h+="<div class='sec'>2 · LIKELY SHAPE</div><p>"+esc(shape)+"</p>";
  h+="<p>Expected goals "+a.lam.toFixed(1)+" – "+a.mu.toFixed(1)+" (total "+a.total.toFixed(1)+"). "+
     "Most likely score "+ms[0]+"–"+ms[1]+" ("+pct0(ms[2])+"), but no single score is likely on its own.</p>";
  h+="<div class='sec'>3 · WHAT TO WATCH</div><ul>"+watch.map(w=>"<li>"+esc(w)+"</li>").join("")+"</ul>";
  h+="<div class='sec'>4 · SAY THIS ON AIR</div><div class='say'>"+say+"</div>";
  h+="<div class='sec'>5 · AFTER THE WHISTLE</div><p class='meta'>Run your 6-step summary: result → how → turning point → best/worst performer (with reasons) → tactical lesson → what it means next.</p>";
  h+="</div>";
  return h;
}

function head(res){
  return "<div class='fixture'>"+esc(res.home)+" &nbsp;v&nbsp; "+esc(res.away)+"</div>"+
    "<div class='meta'>"+esc(res.meta)+"</div>"+
    "<div class='engine"+(res.rough?" rough":"")+"'>"+esc(res.engine)+"</div>";
}

// ---- controller -----------------------------------------------------------
function run(){
  const homeRaw=document.getElementById("home").value;
  const awayRaw=document.getElementById("away").value;
  const out=document.getElementById("out");
  if(!homeRaw.trim()||!awayRaw.trim()){out.innerHTML="<div class='card'>Type both teams.</div>";return;}
  const res=predict(homeRaw,awayRaw);
  if(!res.ok){
    if(res.error==="no-elo"){out.innerHTML="<div class='card'>This fixture needs the Elo bridge, but the snapshot didn't load. Run UPDATE EVERYTHING and push again.</div>";return;}
    let h="<div class='card'>Couldn't find <b>"+esc(res.raw)+"</b> ("+res.which+" team).";
    if(res.suggest&&res.suggest.length){
      h+="<div class='suggest'>Did you mean:</div>";
      h+=res.suggest.map(s=>"<span class='chip' data-fill='"+res.which+"' data-name='"+esc(s)+"'>"+esc(s)+"</span>").join("");
    } else h+="<div class='suggest'>No close match. This club may be outside the data (lower leagues aren't covered).</div>";
    h+="</div>";
    out.innerHTML=h;
    out.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
      document.getElementById(c.dataset.fill).value=c.dataset.name; run();});
    return;
  }
  window._RES=res;
  document.getElementById("tabs").classList.remove("hidden");
  draw();
}
function draw(){
  const res=window._RES; if(!res)return;
  document.getElementById("out").innerHTML =
    "<div class='card'>"+(TAB==="live"?renderLive(res):renderPicks(res))+"</div>";
}

document.getElementById("go").onclick=run;
document.getElementById("swap").onclick=()=>{
  const h=document.getElementById("home"),a=document.getElementById("away");
  [h.value,a.value]=[a.value,h.value]; if(window._RES)run();};
["home","away"].forEach(id=>document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter")run();}));
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  TAB=t.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
  draw();});

// deep link: match.html?home=Arsenal&away=Chelsea
const q=new URLSearchParams(location.search);
if(q.get("home"))document.getElementById("home").value=q.get("home");
if(q.get("away"))document.getElementById("away").value=q.get("away");
window.addEventListener("load",()=>{ if(q.get("home")&&q.get("away")) setTimeout(run,150); });
</script>
